<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200">
  <!-- 조금 · un poco — mano de perfil haciendo "un poquito": índice y pulgar casi juntos -->
  <use href="#kw-brillo" transform="translate(40 50) scale(10)" fill="#FFFFFF"/>
  <use href="#kw-brillo" transform="translate(186 44) scale(7)" fill="#E8B84B"/>
  <use href="#kw-brillo" transform="translate(194 166) scale(6)" fill="#FFFFFF"/>
  <circle cx="22" cy="92" r="3" fill="#FFFFFF"/>
  <circle cx="26" cy="182" r="2.5" fill="#E8B84B"/>
  <circle cx="140" cy="42" r="2.5" fill="#FFFFFF"/>
  <ellipse class="kw-suelo" cx="108" cy="189" rx="70" ry="7" fill="#ADA1F0"/>
  <!-- manga -->
  <rect x="24" y="110" width="32" height="62" rx="11" fill="#4236F6" stroke="#003478" stroke-width="3"/>
  <path d="M34 118 L34 164" fill="none" stroke="#8FB6FF" stroke-width="3" stroke-linecap="round"/>
  <!-- índice (arriba) y pulgar (abajo): trazo doble, salen de detrás del puño; las puntas casi se tocan -->
  <path d="M100 112 Q138 84 156 110" fill="none" stroke="#003478" stroke-width="22" stroke-linecap="round"/>
  <path d="M100 112 Q138 84 156 110" fill="none" stroke="#F2C99A" stroke-width="16" stroke-linecap="round"/>
  <path d="M100 160 Q140 162 154 140" fill="none" stroke="#003478" stroke-width="22" stroke-linecap="round"/>
  <path d="M100 160 Q140 162 154 140" fill="none" stroke="#F2C99A" stroke-width="16" stroke-linecap="round"/>
  <path d="M128 94 Q140 92 148 100" fill="none" stroke="#FFE4C8" stroke-width="3" stroke-linecap="round"/>
  <!-- dedos doblados: solo asoman los nudillos entre el índice y el pulgar -->
  <rect x="104" y="117" width="32" height="13" rx="6.5" fill="#F2C99A" stroke="#003478" stroke-width="2.4"/>
  <rect x="104" y="130" width="30" height="13" rx="6.5" fill="#F2C99A" stroke="#003478" stroke-width="2.4"/>
  <rect x="104" y="143" width="27" height="12" rx="6" fill="#F2C99A" stroke="#003478" stroke-width="2.4"/>
  <!-- puño (dorso de la mano) -->
  <rect x="50" y="100" width="70" height="76" rx="26" fill="#F2C99A" stroke="#003478" stroke-width="3"/>
  <ellipse cx="66" cy="116" rx="5" ry="10" transform="rotate(-35 66 116)" fill="#FFE4C8"/>
  <!-- flechitas que apuntan al hueco: "así de poquito" -->
  <path d="M176 100 L190 100 L183 112 Z" fill="#003478" stroke="#003478" stroke-width="2" stroke-linejoin="round"/>
  <path d="M176 152 L190 152 L183 140 Z" fill="#003478" stroke="#003478" stroke-width="2" stroke-linejoin="round"/>
  <use href="#kw-cara" transform="translate(86 142) scale(0.8)"/>
</svg>
