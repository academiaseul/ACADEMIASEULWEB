    <path d="M82 50 Q94 42 108 42" fill="none" stroke="#6E7591" stroke-width="4.9" stroke-linecap="round"/>
    <use href="#kw-cara-feliz" transform="translate(110 98)"/>
    <ellipse cx="83" cy="109" rx="8.4" ry="5.4" fill="#F3D27A"/>
    <ellipse cx="137" cy="109" rx="8.4" ry="5.4" fill="#F3D27A"/>
