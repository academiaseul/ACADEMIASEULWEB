    <path d="M84 132 Q62 148 66 170 M136 132 Q158 148 154 170" fill="none" stroke="#7FD0B0" stroke-width="9.7" stroke-linecap="round"/>
  </g>
  <!-- piernas cruzadas (양반다리): muslos, dos canillas que se cruzan y los pies descalzos -->
  <path d="M66 152 Q64 138 86 136 L134 136 Q156 138 154 152 Q154 160 144 160 L76 160 Q66 160 66 152 Z" fill="#8FB6FF" stroke="#003478" stroke-width="3" stroke-linejoin="round"/>
