  <path d="M-12 166 L232 166 L232 206 L-12 206 Z" fill="#C99A5E"/>
  <rect x="14" y="174" width="192" height="18" rx="9" fill="#FFF3CC" stroke="#003478" stroke-width="2.4"/>
  <path d="M24 183 Q30 178 36 183 T48 183 T60 183 T72 183 T84 183 T96 183 T108 183 T120 183 T132 183 T144 183 T156 183 T168 183 T180 183 T192 183" fill="none" stroke="#E8B84B" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M-12 146 L232 146 M-12 166 L232 166" fill="none" stroke="#003478" stroke-width="3"/>
  <!-- torso y brazos (personaje base al 72 %), ropa de casa menta -->
  <g transform="matrix(0.72 0 0 0.72 30.8 17)">
    <path d="M78 176 Q76 138 98 124 L122 124 Q144 138 142 176 Q142 182 136 182 L84 182 Q78 182 78 176 Z" fill="#7FD0B0" stroke="#003478" stroke-width="4.2" stroke-linejoin="round"/>
