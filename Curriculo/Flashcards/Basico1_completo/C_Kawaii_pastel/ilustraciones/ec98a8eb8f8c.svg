  <path d="M76 151 L128 158" fill="none" stroke="#8FB6FF" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="137" cy="163" rx="8.5" ry="5.5" transform="rotate(12 137 163)" fill="#C98F5E" stroke="#003478" stroke-width="2.4"/>
  <path d="M144 151 L92 158" fill="none" stroke="#003478" stroke-width="14" stroke-linecap="round"/>
  <path d="M144 151 L92 158" fill="none" stroke="#8FB6FF" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="83" cy="163" rx="8.5" ry="5.5" transform="rotate(-12 83 163)" fill="#C98F5E" stroke="#003478" stroke-width="2.4"/>
  <circle cx="78" cy="140" r="6" fill="#C98F5E" stroke="#003478" stroke-width="2.4"/>
  <circle cx="142" cy="140" r="6" fill="#C98F5E" stroke="#003478" stroke-width="2.4"/>
  <!-- cabeza: piel morena, mejillas doradas, cara feliz de "qué rico este calorcito" -->
  <g transform="matrix(0.72 0 0 0.72 30.8 17)">
    <ellipse cx="62" cy="92" rx="8" ry="10" fill="#C98F5E" stroke="#003478" stroke-width="3.6"/>
