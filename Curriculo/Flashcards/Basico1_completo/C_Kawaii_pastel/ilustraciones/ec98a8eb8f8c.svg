<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200">
  <!-- 온돌 · calefacción bajo el piso — persona sentada descalza en el 장판 tibio; abajo, en corte, el conducto de calor bajo el piso (escena a sangre) -->
  <use href="#kw-brillo" transform="translate(32 40) scale(10)" fill="#FFFFFF"/>
  <use href="#kw-brillo" transform="translate(190 36) scale(7.5)" fill="#E8B84B"/>
  <use href="#kw-brillo" transform="translate(204 88) scale(5.5)" fill="#FFFFFF"/>
  <circle cx="22" cy="92" r="3" fill="#FFFFFF"/>
  <circle cx="148" cy="28" r="2.5" fill="#E8B84B"/>
  <circle cx="208" cy="128" r="2.5" fill="#FFFFFF"/>
  <ellipse class="kw-suelo" cx="110" cy="189" rx="80" ry="7" fill="#D2CBFA"/>
  <!-- ondas de calor que suben del piso -->
  <path d="M38 140 Q32 130 38 120 Q44 110 38 100 M54 138 Q48 130 54 122 Q60 114 54 106 M166 138 Q172 130 166 122 Q160 114 166 106 M182 140 Q188 130 182 120 Q176 110 182 100" fill="none" stroke="#E8B84B" stroke-width="5" stroke-linecap="round"/>
