<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200">
  <!-- 목례 · saludo con una leve inclinación de cabeza -->
  <use href="#kw-brillo" transform="translate(192 66) scale(10)" fill="#FFFFFF"/>
  <use href="#kw-brillo" transform="translate(32 136) scale(7)" fill="#E8B84B"/>
  <use href="#kw-brillo" transform="translate(196 150) scale(6)" fill="#CFC8FF"/>
  <circle cx="202" cy="112" r="3" fill="#FFFFFF"/>
  <circle cx="34" cy="172" r="2.5" fill="#FFFFFF"/>
  <circle cx="24" cy="96" r="2.5" fill="#E8B84B"/>
  <ellipse class="kw-suelo" cx="114" cy="189" rx="60" ry="7" fill="#D2CBFA"/>
  <g transform="translate(6 0)">
    <!-- piernas -->
    <rect x="94" y="170" width="12" height="15" rx="5" fill="#3B4566" stroke="#003478" stroke-width="2.6"/>
    <rect x="114" y="170" width="12" height="15" rx="5" fill="#3B4566" stroke="#003478" stroke-width="2.6"/>
    <!-- torso inclinado hacia adelante (la base queda fija) -->
    <g transform="translate(0 182) skewX(10) translate(0 -182)">
      <path d="M78 176 Q76 138 98 124 L122 124 Q144 138 142 176 Q142 182 136 182 L84 182 Q78 182 78 176 Z" fill="#4236F6" stroke="#003478" stroke-width="3" stroke-linejoin="round"/>
      <path d="M99 124 L110 142 L121 124 Z" fill="#FFFFFF" stroke="#003478" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- brazos: manos juntas al frente (postura cortés) -->
      <path d="M86 132 Q72 152 101 164 M134 132 Q148 152 119 164" fill="none" stroke="#003478" stroke-width="13" stroke-linecap="round"/>
      <path d="M86 132 Q72 152 101 164 M134 132 Q148 152 119 164" fill="none" stroke="#4236F6" stroke-width="7" stroke-linecap="round"/>
      <circle cx="104" cy="164" r="6" fill="#F2C99A" stroke="#003478" stroke-width="2.4"/>
      <circle cx="116" cy="164" r="6" fill="#F2C99A" stroke="#003478" stroke-width="2.4"/>
    </g>
    <!-- zapatos -->
    <ellipse cx="97" cy="186" rx="10.5" ry="5.5" fill="#FFFFFF" stroke="#003478" stroke-width="2.6"/>
    <ellipse cx="118" cy="186" rx="10.5" ry="5.5" fill="#FFFFFF" stroke="#003478" stroke-width="2.6"/>
    <!-- cabeza inclinada hacia adelante, en 3/4 mirando a la izquierda -->
    <g transform="translate(-9 0) rotate(-16 110 126)">
      <ellipse cx="110" cy="84" rx="48" ry="42" fill="#F2C99A" stroke="#003478" stroke-width="3"/>
      <path d="M63 88 Q56 36 112 34 Q166 36 160 94 Q156 102 151 96 Q150 76 138 66 Q124 74 108 68 Q92 76 80 68 Q70 76 63 88 Z" fill="#3B4566" stroke="#003478" stroke-width="3" stroke-linejoin="round"/>
      <path d="M84 50 Q96 42 110 42" fill="none" stroke="#6E7591" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="147" cy="102" rx="7.5" ry="9.5" fill="#F2C99A" stroke="#003478" stroke-width="2.6"/>
      <use href="#kw-cara-feliz" transform="translate(107 101) scale(0.85)"/>
    </g>
  </g>
  <!-- flecha curva: la cabeza baja hacia adelante -->
  <path d="M166 30 Q112 -8 68 28" fill="none" stroke="#003478" stroke-width="11" stroke-linecap="round"/>
  <path d="M166 30 Q112 -8 68 28" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M54 39 L60 19 L76 33 Z" fill="#FFFFFF" stroke="#003478" stroke-width="3" stroke-linejoin="round"/>
</svg>
