  <circle cx="151" cy="153" r="6" fill="#F2C99A" stroke="#003478" stroke-width="2.4"/>
  <use href="#kw-cara-feliz" transform="translate(104 50) scale(0.54)"/>
  <use href="#kw-cara" transform="translate(104 126) scale(0.76)"/>
