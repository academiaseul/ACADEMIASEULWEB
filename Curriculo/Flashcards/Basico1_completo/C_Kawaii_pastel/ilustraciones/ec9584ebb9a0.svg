  <g transform="matrix(0.48 0 0 0.48 51.2 2.7)">
    <ellipse cx="62" cy="92" rx="8" ry="10" fill="#F2C99A" stroke="#003478" stroke-width="5.2"/>
    <ellipse cx="158" cy="92" rx="8" ry="10" fill="#F2C99A" stroke="#003478" stroke-width="5.2"/>
