  <use href="#kw-brillo" transform="translate(196 174) scale(6)" fill="#FFFFFF"/>
  <circle cx="72" cy="20" r="3" fill="#FFFFFF"/>
  <circle cx="206" cy="98" r="2.5" fill="#FFFFFF"/>
