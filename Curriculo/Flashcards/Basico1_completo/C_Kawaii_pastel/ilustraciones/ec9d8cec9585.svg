  <rect x="76" y="170" width="16" height="15" rx="5" fill="#6E7591" stroke="#003478" stroke-width="2.6"/>
  <rect x="128" y="170" width="16" height="15" rx="5" fill="#6E7591" stroke="#003478" stroke-width="2.6"/>
  <!-- caja del parlante: relleno, sombra ondulada, contorno -->
  <rect x="64" y="40" width="92" height="138" rx="18" fill="#F6D47A"/>
