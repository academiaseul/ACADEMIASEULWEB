  <path d="M171 80 L171 46 L197 38 L197 72" fill="none" stroke="#003478" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M171 80 L171 46 L197 38 L197 72" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
