  <path d="M166 118 Q173 133 166 148" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M178 108 Q190 133 178 158" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M54 118 Q47 133 54 148" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M42 108 Q30 133 42 158" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
