<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200">
  <!-- 네? · ¿perdón? — personaje base con la mano ahuecada detrás de la oreja, cabeza ladeada y signo ? -->
  <use href="#kw-brillo" transform="translate(190 40) scale(10)" fill="#FFFFFF"/>
  <use href="#kw-brillo" transform="translate(30 132) scale(7)" fill="#E8B84B"/>
  <use href="#kw-brillo" transform="translate(198 158) scale(5.5)" fill="#CFC8FF"/>
  <circle cx="156" cy="28" r="3" fill="#FFFFFF"/>
  <circle cx="44" cy="170" r="2.5" fill="#E8B84B"/>
  <circle cx="206" cy="120" r="2.5" fill="#FFFFFF"/>
  <ellipse class="kw-suelo" cx="112" cy="189" rx="62" ry="7" fill="#C6E08C"/>
  <!-- signo ? azul de marca (trazo doble) arriba a la izquierda -->
  <path d="M21 50 Q21 34 37 34 Q53 34 53 48 Q53 57 44 60 Q38 63 38 69" fill="none" stroke="#003478" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M21 50 Q21 34 37 34 Q53 34 53 48 Q53 57 44 60 Q38 63 38 69" fill="none" stroke="#4236F6" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="38" cy="86" r="7" fill="#4236F6" stroke="#003478" stroke-width="3"/>
  <!-- piernas y zapatos -->
  <rect x="94" y="170" width="12" height="15" rx="5" fill="#3B4566" stroke="#003478" stroke-width="2.6"/>
  <rect x="114" y="170" width="12" height="15" rx="5" fill="#3B4566" stroke="#003478" stroke-width="2.6"/>
  <ellipse cx="99" cy="186" rx="10.5" ry="5.5" fill="#FFFFFF" stroke="#003478" stroke-width="2.6"/>
  <ellipse cx="121" cy="186" rx="10.5" ry="5.5" fill="#FFFFFF" stroke="#003478" stroke-width="2.6"/>
  <!-- torso: uniforme azul, camisa blanca, corbata dorada -->
  <path d="M78 176 Q76 138 98 124 L122 124 Q144 138 142 176 Q142 182 136 182 L84 182 Q78 182 78 176 Z" fill="#4236F6" stroke="#003478" stroke-width="3" stroke-linejoin="round"/>
