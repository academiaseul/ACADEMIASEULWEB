  <path d="M110 136 L114 142 L110 150 L106 142 Z" fill="#E8B84B" stroke="#003478" stroke-width="2" stroke-linejoin="round"/>
  <!-- brazo izquierdo abajo; brazo derecho sube hasta la oreja -->
  <path d="M84 132 Q72 148 86 162" fill="none" stroke="#003478" stroke-width="13" stroke-linecap="round"/>
  <path d="M84 132 Q72 148 86 162" fill="none" stroke="#4236F6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="87" cy="163" r="6" fill="#F2C99A" stroke="#003478" stroke-width="2.4"/>
  <path d="M136 132 Q174 142 177 122" fill="none" stroke="#003478" stroke-width="13" stroke-linecap="round"/>
  <path d="M136 132 Q174 142 177 122" fill="none" stroke="#4236F6" stroke-width="7" stroke-linecap="round"/>
  <!-- mano abierta detrás de la oreja: 4 dedos inclinados hacia la cabeza (ahuecada) + palma; la oreja queda delante -->
  <rect x="160" y="64" width="9" height="30" rx="4.5" transform="rotate(-14 164.5 94)" fill="#F2C99A" stroke="#003478" stroke-width="2.2"/>
  <rect x="169" y="60" width="9" height="32" rx="4.5" transform="rotate(-10 173.5 92)" fill="#F2C99A" stroke="#003478" stroke-width="2.2"/>
  <rect x="178" y="62" width="9" height="30" rx="4.5" transform="rotate(-6 182.5 92)" fill="#F2C99A" stroke="#003478" stroke-width="2.2"/>
  <rect x="186" y="70" width="8.5" height="24" rx="4.2" transform="rotate(-2 190 94)" fill="#F2C99A" stroke="#003478" stroke-width="2.2"/>
  <path d="M166 84 L184 84 Q195 84 195 96 L194 108 Q192 124 179 124 L172 124 Q160 124 160 110 L160 94 Q160 84 166 84 Z" fill="#F2C99A" stroke="#003478" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M188 92 Q190 102 186 112" fill="none" stroke="#FFE4C8" stroke-width="3" stroke-linecap="round"/>
