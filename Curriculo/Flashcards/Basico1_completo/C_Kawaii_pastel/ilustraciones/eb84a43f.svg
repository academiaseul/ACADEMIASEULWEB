  <g transform="rotate(7 110 126)">
    <ellipse cx="62" cy="92" rx="8" ry="10" fill="#F2C99A" stroke="#003478" stroke-width="2.6"/>
    <ellipse cx="158" cy="92" rx="8" ry="10" fill="#F2C99A" stroke="#003478" stroke-width="2.6"/>
