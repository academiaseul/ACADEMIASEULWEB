    <path d="M63 86 Q58 38 110 36 Q162 38 157 86 Q150 70 138 64 Q128 74 112 69 Q98 76 84 67 Q72 72 63 86 Z" fill="#8C6448" stroke="#003478" stroke-width="3" stroke-linejoin="round"/>
    <path d="M82 50 Q94 42 108 42" fill="none" stroke="#C99A5E" stroke-width="3.5" stroke-linecap="round"/>
    <use href="#kw-cara-o" transform="translate(110 98)"/>
  </g>
</svg>
