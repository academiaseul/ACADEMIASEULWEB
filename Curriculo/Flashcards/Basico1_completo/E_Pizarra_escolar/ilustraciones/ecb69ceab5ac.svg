<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 176" width="220" height="176" data-kr="출구" data-es="salida (del metro)">
  <g fill="none" stroke="#F3F0E4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- la salida de arriba: cielo en trama celeste con el sol que asoma (con cara) -->
