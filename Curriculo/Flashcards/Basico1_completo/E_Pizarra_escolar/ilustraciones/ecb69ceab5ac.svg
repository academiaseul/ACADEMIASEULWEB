    <circle cx="110" cy="58" r="20" fill="url(#rd)" stroke="#E8B84B" stroke-width="2.6"/>
    <use href="#cara" transform="translate(110 56) scale(0.62)"/>
    <rect x="72" y="26" width="76" height="54"/>
