    <path d="M30 128 L72 66 M44 107.3 V134.7 M58 86.7 V107.3" stroke-width="2.6"/>
    <path d="M190 128 L148 66 M176 107.3 V134.7 M162 86.7 V107.3" stroke-width="2.6"/>
