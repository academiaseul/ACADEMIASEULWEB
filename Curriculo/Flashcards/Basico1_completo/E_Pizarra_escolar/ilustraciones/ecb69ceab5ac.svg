    <path d="M52 119 H168 L164.6 112.4 H55.4 Z" fill="url(#rt)" stroke-width="2.4"/>
    <path d="M57.7 108 H162.3 L159.3 102 H60.7 Z" fill="url(#rt)" stroke-width="2.4"/>
    <path d="M62.8 98 H157.2 L154.5 92.6 H65.5 Z" fill="url(#rt)" stroke-width="2.2"/>
    <path d="M67.4 89 H152.6 L149.8 83.6 H70.2 Z" fill="url(#rt)" stroke-width="2.2"/>
