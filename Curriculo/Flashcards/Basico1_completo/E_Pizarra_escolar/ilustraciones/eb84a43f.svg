    <path d="M168 42 C 168 22, 202 22, 202 40 C 202 52, 185 54, 185 66 V69" stroke="#E8B84B" stroke-width="4.5"/>
    <circle cx="185" cy="82" r="4.6" fill="#E8B84B" stroke="none"/>
