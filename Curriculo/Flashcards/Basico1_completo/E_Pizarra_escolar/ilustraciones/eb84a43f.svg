      <path d="M50 68 C 49 48, 63 38, 80 38 C 98 38, 111 48, 110 68 C 107 60, 103 54, 97 52 C 87 55, 72 53, 65 46 C 61 54, 55 60, 50 68 Z" fill="url(#rd)" stroke="#E8B84B" stroke-width="2.4"/>
